name: Windows build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Setup
        shell: pwsh
        run: ./scripts/setup.ps1 -AllowNetwork
      - name: Build
        shell: msys2 {0}
        run: powershell.exe -NoProfile -File scripts/build.ps1
      - name: Test
        shell: msys2 {0}
        run: powershell.exe -NoProfile -File scripts/test.ps1
