name: Public demo security contract tests
on:
  pull_request:
    paths:
      - "tests/test_public_demo_security_contract.py"
      - "public_demo.py"
      - "app.py"
      - ".github/workflows/public-demo-security-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Explicitly run public demo security regression tests
        run: python -m unittest discover -s tests -p 'test_public_demo_security_contract.py' -v
